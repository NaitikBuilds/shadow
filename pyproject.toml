[project]
name = "shadow"
version = "0.1.0"
description = "SHADOW — Silent On-Device Life Context Agent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "BSL-1.1" }
authors = [{ name = "Naitik" }]
dependencies = [
    "PySide6>=6.7",
    "llama-cpp-python @ https://github.com/oobabooga/llama-cpp-python-cuBLAS-wheels/releases/download/cpu/llama_cpp_python-0.3.7+cpuavx-cp311-cp311-win_amd64.whl",
    "sqlite-vec>=0.1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "requests>=2.31",
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
    "pywin32>=306",
    "psutil>=5.9",
    "pillow>=10.0",
    "winrt-runtime>=2.0",
    "winrt-Windows.Foundation>=2.0",
    "winrt-Windows.Foundation.Collections>=2.0",
    "winrt-Windows.Globalization>=2.0",
    "winrt-Windows.Graphics.Imaging>=2.0",
    "winrt-Windows.Media.Ocr>=2.0",
    "winrt-Windows.Storage.Streams>=2.0",
    "pynput>=1.7",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "icalendar>=5.0",
    "winrt-Windows.ApplicationModel.Appointments>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.9", "mypy>=1.10"]

[project.scripts]
shadow = "shadow.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",
    "B008",
    "SIM108",
    "SIM105",
    "SIM102",
    "B027",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/manage_models.py" = ["E402", "I001"]
"tests/test_model_manager.py" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that load models or take >1s (deselect with -m 'not slow')",
    "hardware(name): requires specific hardware, e.g. @pytest.mark.hardware('snapdragon')",
    "injection: prompt-injection security scenarios",
    "network: verifies network isolation",
]
addopts = "-ra --strict-markers"

[tool.shadow]
docs = "docs/"
architecture = "docs/ARCHITECTURE.md"
decisions = "docs/DECISIONS.md"