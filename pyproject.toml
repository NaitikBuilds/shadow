[project]
name = "shadow"
version = "0.1.0"
description = "SHADOW — Silent On-Device Life Context Agent"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Naitik" }]
dependencies = [
    "PySide6>=6.7",
    "llama-cpp-python @ https://github.com/oobabooga/llama-cpp-python-cuBLAS-wheels/releases/download/cpu/llama_cpp_python-0.3.7+cpuavx-cp311-cp311-win_amd64.whl",
    "sqlite-vec>=0.1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "requests>=2.31",
    "onnxruntime>=1.18",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
shadow = "shadow.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]