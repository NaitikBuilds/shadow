name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Network isolation check
        run: python scripts/check_network_isolation.py

      - name: Run fast tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $output = & python -m pytest -m "not slow and not hardware and not injection" -v -p no:cacheprovider 2>&1
          $code = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($code -ne 0) {
            $text = $output -join "`n"
            if ($text -match "=+ (\d+) passed" -and $text -notmatch " failed") {
              Write-Host ""
              Write-Host "pytest exited $code but all tests passed; treating as success."
              exit 0
            }
            Write-Host "pytest exited $code with test failures."
            exit $code
          }

      - name: Show logs directory (only on failure)
        if: failure()
        shell: powershell
        run: |
          if (Test-Path -Path logs) {
            Write-Host "logs directory contents:"
            Get-ChildItem -Path logs -Recurse | Format-Table -AutoSize
          } else {
            Write-Host "logs directory not present"
          }  

      - name: Upload error logs on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: logs/**
          if-no-files-found: ignore