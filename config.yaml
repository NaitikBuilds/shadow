consent:
  screen_capture: false # screen content understanding (active window + visible text)
  document_parsing: false # PDF / doc parsing
  meeting_audio: false # local ASR when enabled
  calendar: false # calendar ingestion
  typing_dynamics: false # pause patterns, rhythm
  webcam_posture: false # optional coarse affect (heavily gated)
  clipboard: false

observation:
  indicator_enabled: true
  indicator_position: "topbar" # topbar | tray | both
  default_mode: "balanced" # lite | balanced | active
  retention_days: 90 # 0 = keep forever

perception:
  enabled: true
  tick_interval_sec: 30          # how often the observer samples
  idle_skip_sec: 600             # skip sampling if user is idle this long
  dedupe_window_sec: 60          # don't repeat identical observations within this window

  # OCR runs on every Nth tick to save CPU (0 = disabled)
  ocr_every_n_ticks: 3

  entity_extraction:
    enabled: true
    known_projects:
      - SHADOW
      - Phase 1
      - Phase 2
      - Phase 3

  # Which perception sources are active
  sources:
    active_window: true
    screen_ocr: true
    typing_dynamics: true
    document_watch: true
    calendar: true
    clipboard: true

  budget:
    enabled: true
    active_multiplier: 0.7
    idle_multiplier: 1.5
    battery_multiplier: 1.5
    low_battery_threshold: 20
    low_battery_multiplier: 2.0
    min_interval_sec: 5
    max_interval_sec: 180  

  # Guardrails
  max_title_length: 200
  min_title_length: 3            # ignore "untitled", empty titles, etc.  

  typing:
    pause_threshold_sec: 2.0
    min_keystrokes: 10

  documents:
    watch_folders:
      - "~/Documents"
      - "~/Downloads"
      - "~/OneDrive/Documents"
    extensions:
      - ".pdf"
      - ".txt"
      - ".md"
      - ".docx"
    max_file_size_mb: 5
    max_chars: 4000

  calendar:
    watch_folders:
      - "~/Documents"
      - "~/Downloads"
      - "~/OneDrive/Documents"
    lookback_days: 1
    lookahead_days: 14  

model:
  path: "models/qwen2.5-1.5b-instruct-q4_k_m.gguf"
  n_ctx: 4096
  n_threads: 6
  n_gpu_layers: 0
  temperature: 0.7
  max_tokens: 512
  embedder_model: "models/minilm/model.onnx"
  embedder_tokenizer: "models/minilm/tokenizer.json"

memory:
  db_path: "data/shadow.db"
  vector_dim: 384

models:
  cache_dir: "models"
  verify_on_load: true
  auto_download_optional: false  

retention:
  observations_days: 0          # 0 = keep forever
  low_value_days: 7             # prune empty/short observations after N days
  activity_days: 180            # 0 = keep forever
  error_logs_days: 30
  orphan_observation_hours: 24
  prune_interval_hours: 24  

capture:
  enabled: true
  hotkey: "<ctrl>+<shift>+s"
  output_dir: "~/SHADOW_workspace/captures"  

redaction:
  enabled: true
  redact_emails: false
  placeholder: "[REDACTED]"


modes:
  default: "balanced"
  lite:
    observation_interval_sec: 60
    model_max_tokens: 128
  balanced:
    observation_interval_sec: 30
    model_max_tokens: 256
  active:
    observation_interval_sec: 10
    model_max_tokens: 512
